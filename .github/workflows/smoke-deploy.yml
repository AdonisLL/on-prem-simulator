name: Smoke deploy

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Deployment scenario
        required: true
        type: choice
        options: [AzureNative, NestedVirtualization, PublicFirewall]
      iac:
        description: IaC implementation
        required: true
        type: choice
        options: [Bicep, Terraform]
      location:
        description: Azure region
        required: true
        default: eastus2
      configure_nested_guests:
        description: Configure nested Hyper-V guests (requires approved media and a dedicated environment)
        required: true
        type: boolean
        default: false
      guest_media_manifest_path:
        description: Nested media manifest path on a dedicated runner; required when configuring nested guests
        required: false
        type: string
      use_temporary_policy_exemption:
        description: Apply the approved SecurityControl=Ignore tag during Azure-native/public-firewall deployment
        required: true
        type: boolean
        default: false
      deployer_address_prefix:
        description: Optional expected PublicFirewall runner egress /32; a mismatch fails before deployment
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 180
    environment: lab-smoke-${{ inputs.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy and validate
        shell: pwsh
        env:
          DEPLOY_LOCATION: ${{ inputs.location }}
          GUEST_MEDIA_MANIFEST_PATH: ${{ inputs.guest_media_manifest_path }}
          EXPECTED_DEPLOYER_ADDRESS_PREFIX: ${{ inputs.deployer_address_prefix }}
        run: |
          $resourceGroup = "rg-opmlab-smoke-${{ github.run_id }}"
          $alphabet = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%*-_'
          $bytes = [byte[]]::new(32)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plainPassword = -join ($bytes | ForEach-Object { $alphabet[$_ % $alphabet.Length] })
          $arguments = @{
            Scenario = '${{ inputs.scenario }}'
            Iac = '${{ inputs.iac }}'
            ResourceGroupName = $resourceGroup
            Location = $env:DEPLOY_LOCATION
            AutoApprove = $true
            AdminPassword = (ConvertTo-SecureString $plainPassword -AsPlainText -Force)
          }
          if (
            '${{ inputs.scenario }}' -eq 'NestedVirtualization' -and
            '${{ inputs.configure_nested_guests }}' -ne 'true'
          ) {
            $arguments.SkipGuestConfiguration = $true
          }
          elseif ('${{ inputs.scenario }}' -eq 'NestedVirtualization') {
            if ([string]::IsNullOrWhiteSpace($env:GUEST_MEDIA_MANIFEST_PATH)) {
              throw 'guest_media_manifest_path is required when configure_nested_guests is true.'
            }
            $arguments.GuestMediaManifestPath = $env:GUEST_MEDIA_MANIFEST_PATH
          }
          if (
            '${{ inputs.scenario }}' -in @('AzureNative', 'PublicFirewall') -and
            '${{ inputs.use_temporary_policy_exemption }}' -eq 'true'
          ) {
            $arguments.UseTemporaryPolicyExemption = $true
          }
          if ('${{ inputs.scenario }}' -eq 'PublicFirewall') {
            $runnerAddress = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            $runnerPrefix = "$runnerAddress/32"
            if (
              -not [string]::IsNullOrWhiteSpace($env:EXPECTED_DEPLOYER_ADDRESS_PREFIX) -and
              $env:EXPECTED_DEPLOYER_ADDRESS_PREFIX -ne $runnerPrefix
            ) {
              throw "The expected deployer prefix does not match this runner's egress prefix, $runnerPrefix."
            }
            Write-Host "Restricting PublicFirewall deployment access to runner prefix $runnerPrefix."
            $arguments.DeployerAddressPrefix = $runnerPrefix
          }
          try {
            .\scripts\Deploy-Lab.ps1 @arguments
            if (-not $arguments.ContainsKey('SkipGuestConfiguration')) {
              $testArguments = @{
                Scenario = '${{ inputs.scenario }}'
                ResourceGroupName = $resourceGroup
              }
              if ('${{ inputs.scenario }}' -eq 'PublicFirewall') {
                $testArguments.DeployerAddressPrefix = $arguments.DeployerAddressPrefix
              }
              .\scripts\Test-Lab.ps1 @testArguments
            }
          }
          finally {
            $plainPassword = $null
            $arguments.AdminPassword = $null
          }

      - name: Always remove smoke resources
        if: always()
        shell: pwsh
        run: |
          .\scripts\Remove-Lab.ps1 `
            -Scenario '${{ inputs.scenario }}' `
            -ResourceGroupName "rg-opmlab-smoke-${{ github.run_id }}" `
            -Iac '${{ inputs.iac }}' `
            -Confirm:$false
